apiVersion: v1
kind: Service
metadata:
  name: {{ include "opensandbox.fullname" . }}-server
  namespace: {{ include "opensandbox.serverNamespace" . }}
  labels:
    {{- include "opensandbox.serverLabels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "opensandbox.serverSelectorLabels" . | nindent 4 }}
  ports:
  - port: {{ .Values.server.service.port }}
    targetPort: {{ .Values.server.config.server.port }}
    protocol: TCP
    {{- if and (eq .Values.server.service.type "NodePort") .Values.server.service.nodePort }}
    nodePort: {{ .Values.server.service.nodePort }}
    {{- end }}
    name: http
