apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opensandbox.fullname" . }}-server-config
  namespace: {{ include "opensandbox.serverNamespace" . }}
  labels:
    {{- include "opensandbox.serverLabels" . | nindent 4 }}
data:
  config.toml: |
    {{- include "opensandbox.configToml" . | nindent 4 }}
